name: 'Prowler'

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  prowler-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
            role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
            aws-region: ${{ vars.AWS_REGION }}

      - name: Run Prowler Scan
        env:
          PROWLER_COMPLIANCE: ${{ vars.PROWLER_COMPLIANCE }}
        run: |
          mkdir -p prowler-output
          chmod 777 prowler-output
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -v ${{ github.workspace }}/prowler-output:/home/prowler/output \
            prowlercloud/prowler:stable \
            aws \
            --region "${AWS_REGION}" \
            --compliance "${PROWLER_COMPLIANCE}" \
            --output-formats json-ocsf html \
            --ignore-exit-code-3

      - name: Upload to S3
        run: |
          aws s3 cp \
            prowler-output \
            s3://${{ secrets.OUTPUT_BUCKET }}/prowler/${{ github.run_number }}/ \
            --recursive
