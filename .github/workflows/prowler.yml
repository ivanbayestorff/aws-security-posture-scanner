name: 'Prowler'

on:
  schedule:
    - cron: "0 3 * * *"  # Daily at 03:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  prowler-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
            role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
            aws-region: ${{ vars.AWS_REGION }}

      - name: Prowler Scan
        uses: prowler-cloud/prowler@v5.25
        with:
          provider: aws
          extra-env: AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
          output-formats: json-ocsf html
          flags: >-
            --region ${{ vars.AWS_REGION }}
            --compliance ${{ vars.PROWLER_COMPLIANCE }}
            --output-bucket ${{ secrets.OUTPUT_BUCKET }}

